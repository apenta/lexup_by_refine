services:
  - type: web
    name: lexup-by-refine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SITE_URL
        value: https://lexup-by-refine.onrender.com
      # Secrets and IDs: set the values in the Render dashboard (Environment tab).
      - key: STRIPE_SECRET
        sync: true
      - key: STRIPE_WEBHOOK_SECRET
        sync: true
      - key: STRIPE_PRICE_MONTHLY
        sync: true
      - key: STRIPE_PRICE_YEARLY
        sync: true
      - key: AIRTABLE_TOKEN
        sync: true
      - key: AIRTABLE_ID
        sync: true